<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NUBI · Tres direcciones, fase 17</title>
<style>
@font-face{font-family:Nunito;src:url('/node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#e9dbc0;color:#163f47;font:20px Nunito,sans-serif}main{max-width:1500px;margin:auto;padding:36px}.label{font-weight:850;font-size:28px;margin:0 0 24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:32px}.page{background:#fbf5ea;padding:28px;border-radius:28px;min-height:920px}header{display:flex;justify-content:space-between;font-weight:850;font-size:17px;border-bottom:1px solid #e9dbc0;padding-bottom:16px}h1{font-size:42px;line-height:1.1;margin:20px 0 12px}h2{font-size:28px;margin:12px 0 6px}p{margin:0 0 20px}img{width:100%;object-fit:contain;display:block;border-radius:24px}button{font:800 20px Nunito;color:#fffcf6;background:#22606b;border:0;border-radius:40px;padding:18px 28px}.nubi{width:130px;margin:auto}.brand{font-size:80px;letter-spacing:.1em}.welcome{text-align:center;padding:20px}.scene{margin:12px 0 24px}.dest{border-bottom:1px solid #e9dbc0;padding-bottom:20px;margin-bottom:20px}.dest img{aspect-ratio:4/3}.meta{font-size:17px;color:#4b5f66}.row{display:grid;grid-template-columns:1fr 1fr;gap:22px}.a .dest{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px}.a .scene{border-radius:100px 24px 24px 24px}.b .welcome{display:flex;align-items:center;gap:20px;text-align:left}.b .brand{font-size:68px}.b .nubi{width:120px;margin:0}.b .school{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}.b .school img{border-radius:60px 24px 24px 24px}.c .nubi{width:100px}.c .dest{display:grid;grid-template-columns:160px 1fr;gap:28px;align-items:center}.c .page{background:#fffcf6}.c .scene{max-width:480px;margin:24px auto}.small{font-size:15px;color:#4b5f66;margin-top:24px}.pending{display:flex;gap:16px;margin-top:28px}.pending>div{flex:1;font-size:17px}.pending img{border-radius:12px}
</style></head><body><main id="main"></main><script>
const dir=new URLSearchParams(location.search).get('direction')||'b';const names={a:'A · Álbum ilustrado interactivo',b:'B · Mundo explorable',c:'C · Exploración serena'};
const art=(name,cls='')=>`<img class="${cls}" src="/media/${name}" alt="">`;
const dest=(id,name,meta,cls='')=>`<div class="dest ${cls}">${art('places/'+id+'.webp')}<div><h2>${name} →</h2><p class="meta">${meta}</p></div></div>`;
document.querySelector('main').innerHTML=`<p class="label">${names[dir]} · Maqueta de composición</p><div class="pair ${dir}"><section class="page"><header><span>NUBI</span><span>Ajustes · Familias</span></header><div class="welcome">${art('characters/nubi-saludo.png','nubi')}<div><h1 class="brand">NUBI</h1><p>Un mundo de historias<br>por descubrir</p></div></div>${art('common/portada-fondo.webp','scene')}<div style="text-align:center"><button>Entrar en mi mundo →</button></div><p class="small">Sin sonidos inesperados · Sin prisas</p></section><section class="page"><header><span>NUBI · Mi mundo</span><span>Ajustes</span></header><h1>Mi mundo</h1><p>¿Adónde quieres ir hoy?</p>${dest('colegio','Colegio','1 historia · Entrar','school')}<div class="${dir==='b'?'row':''}">${dest('emociones','Mis emociones','Conocer lo que sentimos.')}${dest('herramientas','Mis herramientas','Ideas que pueden ayudar.')}</div><div class="pending">${[['casa','Casa'],['parque','Parque'],['amigos','Amigos']].map(([id,n])=>`<div>${art('places/'+id+'.webp')}<strong>${n}</strong><br>Próximamente</div>`).join('')}</div></section></div><p class="small">Exploración visual: recursos originales sin modificar. Propuestas de interfaz, sin validación con usuarios.</p>`;
</script></body></html>
